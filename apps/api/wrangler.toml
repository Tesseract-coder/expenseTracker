# Kharcha Worker: serves the built PWA (Workers Static Assets) and the Hono API at /api/*.
# Top level = local dev. Bindings are NOT inherited by [env.*], so each env repeats them.
name = "kharcha-dev"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
APP_ENV = "dev"
AUTH_MODE = "dev"            # dev bypass works ONLY on localhost and never when APP_ENV=production
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ASYNC_MODE = "inline"        # inline | queue (Queues optional; Free plan default inline)
AI_ENABLED = "false"
APP_VERSION = "dev"
# ALLOWED_EMAILS is a secret: put it in .dev.vars locally, `wrangler secret put` remotely.

[[d1_databases]]
binding = "DB"
database_name = "kharcha-dev"
database_id = "00000000-0000-0000-0000-000000000000"   # local only
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "STATEMENTS"
bucket_name = "kharcha-statements-dev"


# Local dev / E2E: generous, because every Playwright test shares one dev user and runs in parallel.
# Preview and production keep the real per-user limit (30/min per scope).
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
simple = { limit = 1000, period = 60 }

# Daily jobs at 02:00 IST (recurring-payment refresh, audit-log pruning). Test locally with
# `wrangler dev --test-scheduled` and GET /__scheduled. Triggers are not inherited by envs.
[triggers]
crons = ["30 20 * * *"]

# ---------------------------------------------------------------------------
[env.preview]
name = "kharcha-preview"
workers_dev = true
preview_urls = true

[env.preview.vars]
APP_ENV = "preview"
AUTH_MODE = "access"
ACCESS_TEAM_DOMAIN = "REPLACE_ME.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_ME_PREVIEW_AUD"
ASYNC_MODE = "inline"
AI_ENABLED = "false"
APP_VERSION = "preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "kharcha-preview"
database_id = "REPLACE_ME_PREVIEW_D1_ID"
migrations_dir = "../../migrations"

[[env.preview.r2_buckets]]
binding = "STATEMENTS"
bucket_name = "kharcha-statements-preview"


[[env.preview.ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# ---------------------------------------------------------------------------
[env.production]
name = "kharcha"
workers_dev = true          # https://kharcha.kunalnevrekar.workers.dev (add a custom-domain route later)
preview_urls = false        # version previews would share prod bindings — keep them off

[env.production.vars]
APP_ENV = "production"
AUTH_MODE = "access"
ACCESS_TEAM_DOMAIN = "REPLACE_ME.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_ME_PRODUCTION_AUD"
ASYNC_MODE = "inline"
AI_ENABLED = "false"
APP_VERSION = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "kharcha-prod"
database_id = "REPLACE_ME_PRODUCTION_D1_ID"
migrations_dir = "../../migrations"

[[env.production.r2_buckets]]
binding = "STATEMENTS"
bucket_name = "kharcha-statements"

[[env.production.ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[env.production.triggers]
crons = ["30 20 * * *"]   # preview has no cron, to stay well inside the Free plan's 5 triggers

# Optional, add per env when enabled:
# [[env.production.queues.producers]]  binding = "IMPORT_QUEUE"  queue = "kharcha-jobs"
# [[env.production.queues.consumers]]  queue = "kharcha-jobs"
# [env.production.ai]                  binding = "AI"
