name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Schema drift (drizzle schema must match committed migrations)
        run: |
          pnpm db:generate
          git diff --exit-code -- migrations || (echo "::error::Run 'pnpm db:generate' and commit the migration" && exit 1)

      - name: Build
        run: pnpm build
      - name: Unit + integration tests (with coverage)
        run: pnpm test:coverage

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (mobile viewports, against wrangler dev)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
